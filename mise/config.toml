[tools]
buf = "1.59.0"
git-cliff = "2.12.0"
go = """
{%- set gomod = read_file(path=config_root ~ "/go.mod") -%}
{%- for line in gomod | split(pat="\n") -%}
{%- set parts = line | trim | split(pat=" ") -%}
{%- if parts | first == "go" and parts | length == 2 -%}
{{- parts | last | trim -}}
{%- endif -%}
{%- endfor -%}
"""
jq = "1.8.1"
protoc = "34.1"
protoc-gen-go = "1.36.9"
protoc-gen-go-grpc = "1.6.1"

[settings]
pin = true
